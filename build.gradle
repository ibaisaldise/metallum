plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def benchCommit = {
	try {
		def hash = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }.standardOutput.asText.get().trim()
		def dirty = !providers.exec { commandLine 'git', 'status', '--porcelain', '--untracked-files=no' }.standardOutput.asText.get().trim().isEmpty()
		return dirty ? "${hash}-dirty" : hash
	} catch (Exception ignored) {
		return "unknown"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")

	runs {
		// ./gradlew runBenchmark [-Pbench.label=x] [-Pbench.duration=30] [-Pbench.warmup=20]
		//   [-Pbench.renderDistance=16] [-Pbench.width=1600] [-Pbench.height=900] [-Pbench.present=true]
		// Results land in run/metallum-bench/. Prefer scripts/bench.py, which also compares runs.
		benchmark {
			inherit client
			configName = "Benchmark"
			ideConfigGenerated = false
			programArgs "--width", "${findProperty('bench.width') ?: 1600}", "--height", "${findProperty('bench.height') ?: 900}"
			vmArgs(
					"-Dmetallum.bench=true",
					"-Dmetallum.bench.label=${findProperty('bench.label') ?: 'run'}",
					"-Dmetallum.bench.commit=${benchCommit()}",
					"-Dmetallum.bench.duration=${findProperty('bench.duration') ?: 30}",
					"-Dmetallum.bench.warmup=${findProperty('bench.warmup') ?: 20}",
					"-Dmetallum.bench.renderDistance=${findProperty('bench.renderDistance') ?: 16}",
					"-Dmetallum.bench.present=${findProperty('bench.present') ?: false}"
			)
		}
	}
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
